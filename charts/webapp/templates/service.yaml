apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  # ClusterIP by default: Caddy (the sandbox reverse proxy) fronts all external
  # traffic and reaches these via *.svc.cluster.local, so the apps don't need a
  # host-bound LoadBalancer. Exposing one on :80 would shadow Caddy's HTTP port.
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http                        # named port — required by `sandbox intercept` (telepresence)
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
