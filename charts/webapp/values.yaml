# Default knobs. Every field here is overridable at install time with -f <file> or --set key=val.
# Resource NAMES come from the Helm release name (.Release.Name), not a value — so the same
# chart installed as `rest-hello` vs `next-hello` produces differently-named resources for free.

image: ""            # REQUIRED — set per release (e.g. rest-hello:local). Empty default fails loudly.
replicaCount: 1
containerPort: 3000  # port the app listens on inside the container
probePath: /         # readiness probe path
service:
  type: ClusterIP    # Caddy fronts external traffic; set to LoadBalancer only for direct host access
  port: 80           # service port (Caddy dials this via <release>.default.svc.cluster.local)
