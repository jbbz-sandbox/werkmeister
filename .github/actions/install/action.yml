name: Install
description: pnpm, Node and node_modules, installed from the cached pnpm store.
inputs:
  node-version:
    description: Node major to install. 24 for everything but the node-floor job.
    default: "24"
runs:
  using: composite
  steps:
    # Before setup-node: its `cache: pnpm` asks pnpm where the store is. The
    # version comes from package.json `packageManager`.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    # From the cached store this takes as long as restoring a node_modules cache did.
    - run: pnpm install --frozen-lockfile
      shell: bash
