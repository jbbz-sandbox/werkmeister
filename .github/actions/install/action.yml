name: Install
description: pnpm, Node and node_modules, restored from cache when the lockfile is unchanged.
inputs:
  node-version:
    description: Node major to install. 24 for everything but the node-floor job.
    default: "24"
runs:
  using: composite
  steps:
    # Before setup-node: its `cache: pnpm` asks pnpm where the store is. The
    # version comes from package.json `packageManager`.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    # node_modules itself, not just the pnpm store: a hit skips the install
    # entirely. The lockfile changes on every version PR, so those runs still
    # pay for the install, from the cached store.
    - uses: actions/cache@v4
      id: node-modules
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: steps.node-modules.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
