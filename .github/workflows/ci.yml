name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run in flight (changesets force-pushes
# the version PR after every merge to main, so its stale runs piled up). Pushes
# to main get a group each, so they never cancel or queue behind one another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The dashboard smoke tests drive the real `commitAndPush`, which commits
      # with the ambient git identity by design (the handoff commit belongs to
      # the developer, not to a hardcoded bot). Runners have no identity
      # configured, so that `git commit` fails with "Author identity unknown".
      - name: Configure a git identity for the smoke tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
      # Turbo's local cache, carried across runs so unchanged packages replay
      # instead of rebuilding. Turbo doesn't hash the Node version, hence the key.
      # Only this job saves it: the others restore and would otherwise race it
      # for the key with a dir holding fewer builds.
      # ponytail: the dir only grows (each save carries the last); GitHub's 10GB
      # LRU evicts old entries. Prune or move to a remote cache if restores slow.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node24-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node24-
      # SW-63: a new dependency under a licence outside the allowlist fails here.
      - run: pnpm run licenses
      # Before turbo so a lint or format failure surfaces in seconds, not after the build.
      - run: pnpm exec biome ci .
      # SW-82: a broken `{@link}` in core's comments fails here; it needs no build.
      - run: pnpm --filter werkmeister-core run docs:links
      # One invocation so typecheck runs alongside build instead of before it.
      # werkmeister-core's tests run sharded in `core-test` below; its build
      # still runs here as every other package depends on it, and `tsc` there
      # type-checks the same files its `typecheck` would.
      - run: pnpm turbo run typecheck build test --filter='!werkmeister-core'
      # After the build: commands and flags come from the built CLI's `__complete`.
      # Its unit test runs with `licenses` above (scripts/*.test.mjs).
      - run: pnpm run docs:check
      # The extension host is an Electron app: it needs a display even headless,
      # and it downloads its own VS Code build on first run. With the build
      # cached for the version pinned in .vscode-test.mjs, vscode-test skips
      # update.code.visualstudio.com entirely (#151).
      - uses: actions/cache@v4
        with:
          path: packages/werkmeister-vscode/.vscode-test
          key: vscode-${{ runner.os }}-1.93.0-${{ hashFiles('packages/werkmeister-vscode/.vscode-test.mjs') }}
      - run: xvfb-run -a pnpm --filter werkmeister-vscode run test:integration
      # `vsce package` fails on a README link it can't rewrite, and is the only
      # check on .vscodeignore — #38 broke packaging and nothing caught it.
      - run: pnpm --filter werkmeister-vscode run package

  # The core suite is ~100 files that each spawn a process, CPU-bound on a
  # 4-vCPU runner: 116s when it shared the runner with every other build. Two
  # shards on runners of their own, in parallel with `test`.
  core-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Configure a git identity for the smoke tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node24-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node24-
      - run: pnpm turbo run build --filter=werkmeister-core
      - run: node --test --test-shard=${{ matrix.shard }}/2 *.test.mjs
        working-directory: packages/werkmeister-core
      # The smoke files are a few seconds in total; one shard takes them all.
      - if: matrix.shard == 2
        run: for f in *.smoke.mjs; do node "$f" || exit 1; done
        working-directory: packages/werkmeister-core

  # SW-77: engines promises Node >=22, so the suites the gate names run on 22
  # itself. Everything else stays on 24, whose bundled npm the release needs.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure a git identity for the smoke tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
        with:
          node-version: 22
      - run: pnpm turbo run test --filter=werkmeister --filter=werkmeister-mcp --filter=werkmeister-core

  # Gated on the test jobs rather than repeating their checks: a publish cannot
  # be taken back, and this used to be a separate workflow that raced CI on
  # every push.
  release:
    needs: [test, core-test, node-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # npm refuses a re-publish of a version, so two overlapping runs
    # would not race harmlessly — the loser fails.
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write        # push the version branch and the release tag
      pull-requests: write   # open and update the "version packages" PR
      id-token: write        # npm trusted publishing: OIDC instead of a stored token
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      # A push made with GITHUB_TOKEN gets its CI held for approval, so the
      # version PR could merge before `test` ran on it. A GitHub App token's
      # pushes run CI like a person's. Without the App configured
      # (RELEASE_APP_ID variable, RELEASE_APP_PRIVATE_KEY secret) this falls
      # back to GITHUB_TOKEN and the old behaviour.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The checkout's credentials are what changesets/action pushes the
      # version branch and tags with.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      # changesets/action's own commit needs an identity, and a runner has none.
      - name: Configure a git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
      # Restores what `test` just saved, so `pnpm run release`'s build replays
      # from cache.
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node24-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node24-
      # With changesets pending: opens/updates the version PR. With none pending
      # (i.e. that PR just merged): publishes and tags.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # Opens/updates the version PR and creates the GitHub release.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # No npm token: changesets runs `pnpm publish`, which packs (rewriting
          # `workspace:*`) and hands the tarball to the npm CLI. npm >= 11.5.1,
          # bundled with Node 24, authenticates through the job's OIDC token,
          # which npmjs.com accepts because this workflow is the package's
          # trusted publisher.

  # SW-80: the docs site tracks the latest published release. Its own job, so npm
  # publishing stays off the github-pages environment (its branch rules, and the
  # environment claim it would add to the npm OIDC token).
  docs-deploy:
    needs: release
    if: needs.release.outputs.published == 'true'
    concurrency: pages
    permissions:
      pages: write      # deploy-pages
      id-token: write   # deploy-pages proves the run with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm turbo run build --filter=docs-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs-site/dist
      - id: deploy
        uses: actions/deploy-pages@v5
