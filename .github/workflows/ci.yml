name: CI

on:
  push:
    branches: [main]
  pull_request:
  # SW-255: the merge queue re-tests each PR on top of the latest main before it merges.
  merge_group:

# A newer push to the same PR cancels the run in flight (changesets force-pushes
# the version PR after every merge to main, so its stale runs piled up). Pushes
# to main get a group each, so they never cancel or queue behind one another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # SW-477: main moves to the exact commit the merge queue tested, so a push the
  # queue already passed skips the test jobs. A push that bypassed the queue, or
  # a failed lookup (empty output), tests as before.
  queued:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=merge_group&status=success" --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length') || n=0
          echo "tested=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: queued
    # !cancelled(): `queued` is skipped on pull_request and merge_group, which would skip this too.
    # The version PR's own run skips the suites: it changes versions, changelogs and
    # the lockfile, and the merge queue tests that exact commit before it lands.
    if: ${{ !cancelled() && needs.queued.outputs.tested != 'true' && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The dashboard smoke tests drive the real `commitAndPush`, which commits
      # with the ambient git identity by design (the handoff commit belongs to
      # the developer, not to a hardcoded bot). Runners have no identity
      # configured, so that `git commit` fails with "Author identity unknown".
      - name: Configure a git identity for the smoke tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
      # SW-63: a new dependency under a licence outside the allowlist fails here.
      - run: pnpm run licenses
      # Before turbo so a lint or format failure surfaces in seconds, not after the build.
      - run: pnpm exec biome ci --diagnostic-level=error .
      # SW-1000: `biome ci` passes at every level with safe fixes still unapplied; fail on any.
      - run: pnpm exec biome check --write . && git diff --exit-code
      # SW-82: a broken `{@link}` in core's comments fails here; it needs no build.
      - run: pnpm --filter werkmeister-core run docs:links
      # SW-655, SW-750: every symbol on werkmeister-core/sdk (the public entry) carries TSDoc with an @example.
      - run: pnpm --filter werkmeister-core run docs:sdk
      # One invocation so typecheck runs alongside build instead of before it.
      # werkmeister-core's tests run sharded in `core-test` below; its build
      # still runs here as every other package depends on it, and `tsc` there
      # type-checks the same files its `typecheck` would.
      # SW-327: the plugin's turbo `typecheck`/`test` run `claude`. A global install, not a
      # dependency: its licence is outside the allowlist. Bump with the plugin's types.
      - run: npm i -g @anthropic-ai/claude-code@2.1.316
      - run: pnpm turbo run typecheck build test --continue --filter='!werkmeister-core'
      # After the build: commands and flags come from the built CLI's `__complete`.
      # Its unit test runs with `licenses` above (scripts/*.test.mjs).
      - run: pnpm run docs:check
      # SW-106: the pre-Werkmeister name fails here, outside the kept names in the script.
      - run: pnpm run name:check
      # The extension host is an Electron app: it needs a display even headless,
      # and it downloads its own VS Code build on first run. With the build
      # cached for the version pinned in .vscode-test.mjs, vscode-test skips
      # update.code.visualstudio.com entirely (#151).
      - uses: actions/cache@v4
        with:
          path: packages/werkmeister-vscode/.vscode-test
          key: vscode-${{ runner.os }}-1.93.0-${{ hashFiles('packages/werkmeister-vscode/.vscode-test.mjs') }}
      - run: xvfb-run -a pnpm --filter werkmeister-vscode run test:integration
      # `vsce package` fails on a README link it can't rewrite, and is the only
      # check on .vscodeignore — #38 broke packaging and nothing caught it.
      - run: pnpm --filter werkmeister-vscode run package
      # Last, so docs:check's `__complete` and the VS Code tests are checked too (SW-1154).
      - run: sh scripts/require-clean-home.sh
        if: ${{ !cancelled() }}

  # The core suite is ~100 files that each spawn a process, CPU-bound on a
  # 4-vCPU runner: 116s when it shared the runner with every other build. Two
  # shards on runners of their own, in parallel with `test`.
  core-test:
    needs: queued
    # SW-847: the version-PR skip sits on the steps, not here: a matrix job skipped at
    # job level never expands, so the required `core-test (1)`/`(2)` never report.
    # test/ci-required-checks.test.mjs fails if a required name goes missing.
    if: ${{ !cancelled() && needs.queued.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        if: github.head_ref != 'changeset-release/main'
      - name: Configure a git identity for the smoke tests
        if: github.head_ref != 'changeset-release/main'
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
        if: github.head_ref != 'changeset-release/main'
      - run: pnpm turbo run build --filter=werkmeister-core
        if: github.head_ref != 'changeset-release/main'
      # The smoke files are a few seconds in total; the last shard takes them all.
      - run: pnpm test ${{ matrix.shard }}/2
        if: github.head_ref != 'changeset-release/main'
        working-directory: packages/werkmeister-core
      # SW-816: a file that throws in after() or leaves a handle open under a no-match pattern (SW-797) fails or hangs here.
      - run: pnpm run test:no-match
        if: matrix.shard == 2 && github.head_ref != 'changeset-release/main'
        working-directory: packages/werkmeister-core
        timeout-minutes: 5
      - run: sh scripts/require-clean-home.sh
        if: ${{ !cancelled() && github.head_ref != 'changeset-release/main' }}

  # SW-77: engines promises Node >=22, so the suites the gate names run on 22
  # itself. Everything else stays on 24, whose bundled npm the release needs.
  node-floor:
    needs: queued
    if: ${{ !cancelled() && needs.queued.outputs.tested != 'true' && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure a git identity for the smoke tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
        with:
          node-version: 22
      - run: pnpm turbo run test --continue --filter=werkmeister --filter=werkmeister-mcp --filter=werkmeister-core
      - run: sh scripts/require-clean-home.sh
        if: ${{ !cancelled() }}

  # SW-405: coverage for every package, as a job summary and artifacts. On a PR, SW-1129's drop check warns
  # when a package's lines % falls more than 1 point; nothing fails on the numbers, and it is not a required
  # check. Main pushes skip it like `test`; the merge-queue run of that commit is main's baseline, the one a
  # PR's summary compares against.
  coverage:
    needs: queued
    if: ${{ !cancelled() && github.event_name != 'push' && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run download of the baseline artifact
      pull-requests: read # gh pr view of the coverage-drop-ok label
    steps:
      - uses: actions/checkout@v7
      - name: Configure a git identity for the smoke tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: ./.github/actions/install
      - run: pnpm turbo run build test:coverage --continue
      - run: sh scripts/require-clean-home.sh
        if: ${{ !cancelled() }}
      - name: Baseline from the last merge-queue run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow ci.yml --event merge_group --status success -L1 --json databaseId --jq '.[0].databaseId') &&
            gh run download "$id" -n coverage-summary -D base || echo "no baseline"
      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          # A pull_request run checks out a merge commit; the ledger wants the PR's own head.
          COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/coverage-summary.mjs --base base/summary.json --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-summary
          path: coverage/summary.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-html
          path: |
            apps/*/coverage/
            packages/*/coverage/
      # SW-1129: PRs only, since a merge-queue run is main's baseline and has no PR to label. Last, so its
      # rewrite of coverage/summary.json can't reach the uploaded artifact.
      - name: Coverage drop check
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Read live: a re-run replays the old event payload, labels included.
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx coverage-drop-ok; then
            echo "coverage-drop-ok label set: drop check skipped"; exit 0
          fi
          # Warns first (SW-1129 D2): add --fail once two weeks of ci-main rows confirm the limit.
          node scripts/coverage-summary.mjs --base base/summary.json --max-drop 1

  # Gated on a green queue run of this commit or on this push's test jobs,
  # rather than repeating their checks: a publish cannot be taken back, and this
  # used to be a separate workflow that raced CI on every push.
  release:
    needs: [queued, test, core-test, node-floor]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.queued.outputs.tested == 'true' ||
       (needs.test.result == 'success' && needs.core-test.result == 'success' && needs.node-floor.result == 'success'))
    # npm refuses a re-publish of a version, so two overlapping runs
    # would not race harmlessly — the loser fails.
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write        # push the version branch and the release tag
      pull-requests: write   # open and update the "version packages" PR
      id-token: write        # npm trusted publishing: OIDC instead of a stored token
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      # 'true' while main holds changes no release has shipped yet.
      pending: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      # A push made with GITHUB_TOKEN gets its CI held for approval, so the
      # version PR could merge before `test` ran on it. A GitHub App token's
      # pushes run CI like a person's. Without the App configured
      # (RELEASE_APP_ID variable, RELEASE_APP_PRIVATE_KEY secret) this falls
      # back to GITHUB_TOKEN and the old behaviour.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The checkout's credentials are what changesets/action pushes the
      # version branch and tags with.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      # changesets/action's own commit needs an identity, and a runner has none.
      - name: Configure a git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
      # Needs only gh and node's built-ins, both on the runner, so it runs before install.
      - id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: node scripts/release-plan.mjs
      - uses: ./.github/actions/install
      # SW-1267: with changesets pending the action below only versions. Hide them so it publishes:
      # for one extra publish-mode run (same tags and GitHub releases) when main's version isn't on
      # npm, or for good when none of them would be versioned.
      - id: publish-plan
        run: node scripts/publish-first.mjs
      - name: Hide pending changesets
        if: steps.publish-plan.outputs.hide == 'true'
        run: find .changeset -name '*.md' ! -name README.md -delete
      - id: publish-first
        if: steps.publish-plan.outputs.restore == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Restore the pending changesets
        if: steps.publish-plan.outputs.restore == 'true'
        run: git checkout -- .changeset
      # With changesets pending: opens/updates the version PR. With none pending
      # (i.e. that PR just merged): publishes and tags.
      - id: changesets
        # != 'false': a plan step that wrote nothing runs this as before.
        if: steps.plan.outputs.run_changesets != 'false'
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # Opens/updates the version PR and creates the GitHub release.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # No npm token: changesets runs `pnpm publish`, which packs (rewriting
          # `workspace:*`) and hands the tarball to the npm CLI. npm >= 11.5.1,
          # bundled with Node 24, authenticates through the job's OIDC token,
          # which npmjs.com accepts because this workflow is the package's
          # trusted publisher.

  # SW-96: a docs-only merge publishes nothing, so on its own the site would wait
  # for the next release to show it. "Only docs" means every changed file is a
  # .md file or lives under docs/ or apps/docs-site/ (so a diagram added next to
  # its page counts); a merge that also touches code keeps waiting for its
  # release, so the site never describes an unpublished CLI. A force-push leaves
  # `before` with no common ancestor, so the compare fails: treat that as not
  # docs-only rather than failing the run.
  docs-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.only_docs }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --paginate --jq '.files[].filename') || files=
          if [ -n "$files" ] && ! grep -qvE '(\.md$|^docs/|^apps/docs-site/)' <<<"$files"; then
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          fi

  # SW-80: the docs site tracks the latest published release, plus docs-only
  # merges (SW-96) while no changeset is pending: the build is all of main, so
  # with one pending it would publish docs for code no release has shipped. Its
  # own job, so npm publishing stays off the github-pages environment (its
  # branch rules, and the environment claim it would add to the npm OIDC token).
  docs-deploy:
    needs: [release, docs-only]
    # !cancelled(): the implicit success() also counts the test jobs a queued push skips (SW-477).
    if: >-
      !cancelled() && needs.release.result == 'success' && needs.docs-only.result == 'success' &&
      (needs.release.outputs.published == 'true' ||
       (needs.docs-only.outputs.changed == 'true' && needs.release.outputs.pending == 'false'))
    concurrency: pages
    permissions:
      pages: write      # deploy-pages
      id-token: write   # deploy-pages proves the run with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: pnpm turbo run build --filter=docs-site
      # Named per attempt: a re-run uploads again into the same run, and deploy-pages
      # refuses a run holding two artifacts of the name it looks for.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs-site/dist
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
