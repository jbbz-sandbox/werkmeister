apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-hello
  labels: { app: next-hello }
spec:
  replicas: 1
  selector:
    matchLabels: { app: next-hello }
  template:
    metadata:
      labels: { app: next-hello }
    spec:
      containers:
        - name: next-hello
          image: next-hello:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: next-hello
spec:
  type: ClusterIP         # Caddy fronts external traffic and reaches this via cluster DNS
  selector: { app: next-hello }
  ports:
    - port: 8080          # service port Caddy dials (next-hello.default.svc.cluster.local:8080)
      targetPort: 3000
