# One file, two resources (--- separates them): the Deployment runs the pods,
# the Service gives them a stable address. This is the core k8s pattern.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-hello
  labels: { app: rest-hello }
spec:
  replicas: 2                      # two pods, so you can watch the Service load-balance between them
  selector:
    matchLabels: { app: rest-hello }
  template:
    metadata:
      labels: { app: rest-hello }  # Service finds pods by matching THESE labels
    spec:
      containers:
        - name: rest-hello
          image: rest-hello:local
          imagePullPolicy: IfNotPresent   # use the locally-built image; never pull from a registry
          ports:
            - containerPort: 3000
          readinessProbe:                 # k8s won't send traffic until /health returns 200
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rest-hello
spec:
  type: ClusterIP            # Caddy fronts external traffic and reaches this via
                             # cluster DNS; a :80 LoadBalancer would shadow Caddy's HTTP port
  selector: { app: rest-hello }
  ports:
    - port: 80                 # service port (in-cluster)
      targetPort: 3000         # container port
