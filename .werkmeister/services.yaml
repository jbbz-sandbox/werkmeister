# Werkmeister service-registry fragment for this repo.
#
# `werkmeister registry sync` (run by `werkmeister machine setup`) merges every
# <repo>/.werkmeister/services.yaml under paths.repos_root into
# ~/.werkmeister/services.yaml. Only `services:`, `setup_services:`,
# `infrastructure:` and `repo:` (this repo's own settings, merged into
# `repos.<dir>`) may appear here; the repo key is the checkout's directory name
# and the rest of `repos:` is derived. {{home}}, {{repos_root}}, {{workspaces_root}},
# {{werkmeister_home}} (the tool's home folder) and {{local_domain}} expand at merge time. `x-` keys hold YAML
# anchors and are dropped from the output.

# Ship detection for `werkmeister pr status` and the pre-PR gate's release check
# (docs/workspace-lifecycle.md): changesets publishes and tags each release, so
# a merge has shipped once a werkmeister release tag contains it.
repo:
  ship: tag
  release_tag: "werkmeister@*"
  release_check: pnpm changeset status --since=origin/main
  # CI's `test` job checks that need no display: licences, format, typedoc links, generated docs, the old name; the gate runs
  # them so each fails before the PR opens (SW-133, SW-225, SW-252, SW-312). docs:check reads the built CLI and core.
  # Left out: vscode test:integration and package (need xvfb and a downloaded VS Code), typecheck/test (the services' `test:`).
  # SW-226: --diagnostic-level=error keeps the exit code but prints only errors, so a format error is not buried under warnings.
  lint: pnpm run licenses && pnpm exec biome ci --diagnostic-level=error . && pnpm --filter werkmeister-core run docs:links && pnpm turbo run build --filter=werkmeister && pnpm run docs:check && pnpm run name:check
  # Changes here touch no service, so the gate runs no service tests for them.
  # Anything else outside a service's `path` still touches every service.
  no_service_paths: [docs, .changeset, .gitignore, README.md, .github, .vscode, .claude]
  # SW-450: paths no service owns by path, so a change there doesn't test all five.
  path_mappings:
    apps/werkmeister-mcp: cli # cli's row runs --filter=werkmeister-mcp
    plugins: werkmeister-core # plugin tests live in core; core's row also runs cli's filters

services:
  # --- The werkmeister repo's own workspaces (self-hosting) -----------------------
  # All five share one repo bind mount at /app and one per-feature node_modules
  # volume; werkmeister-install populates it and builds werkmeister-core/dist first.
  # 2G each: the pre-PR gate runs cli's cold typecheck + test (~900M anon) in any of
  # them, beside the dashboard's dev server (~180M); 1G left no headroom (SW-130,
  # SW-128), and the dashboard's build runs out of heap at 512M.
  # cli, werkmeister-core and werkmeister-vscode (types cli/library/extension) idle under
  # `sleep infinity` with no healthcheck; their `command:` watchers run only under
  # `werkmeister feature up --dev`. The port is still published, so they keep their slot.
  # See docs/users-guide.md "Self-hosting the Werkmeister repo" in the werkmeister repo.
  # Fully functional CLI: the host's docker socket plus ~/.werkmeister, ~/repos,
  # ~/features and ~/.kube mounted at their host paths, because the compose
  # files it generates carry host bind-mount paths and the daemon is the
  # host's. HOME matches so `~` expands the same way; PATH puts the worktree's
  # own `werkmeister` wrapper first (the dogfood point) and the tools volume next.
  # GIT_CONFIG_* marks every directory safe: the worktrees belong to the host
  # uid, and git refuses "dubious ownership" otherwise. The anchors below are
  # reused by every other service here, so this entry must stay above them.
  cli:
    path: apps/cli
    type: cli
    archetype: node-tool
    # apps/werkmeister-mcp ships inside the CLI (dist/mcp.js), so its tests run here.
    test: "pnpm turbo run typecheck test --continue --filter=werkmeister --filter=werkmeister-mcp"
    # SW-143: the ICM exercise step defers to this text for a CLI, so the whole recipe lives here.
    validate: &cli_validate >-
      In this repo the host checkout has no node_modules (`tsc: command not found`, `ERR_MODULE_NOT_FOUND: dockerode`), so run every command below, the install, the build, the tests and `with-fixture-workspace`, through `docker exec -w /app/<path> <container> <command>` (container names are in `werkmeister-context.md`),
      after `werkmeister feature up --service <name>`: starting this workspace's own container is expected for implement and exercise and allowed. The `with-temp-home` wrapper is the host form of the same test command; inside the container the HOME is already the container's.
      Fresh worktree (no node_modules, no dist/): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION),
      then `pnpm turbo run build --filter=werkmeister` before the first test: it builds the CLI, and `apps/cli/dist/main.js` bundles werkmeister-core, so building core alone leaves the CLI stale.
      Run it as `node apps/cli/dist/main.js`, not `node apps/cli/werkmeister` (a bash wrapper: `SyntaxError: Invalid or unexpected token`).
      Fast route for a core-only change, once the install and build above have run (a fresh worktree fails ERR_MODULE_NOT_FOUND for dist/config.js without them): `cd packages/werkmeister-core && <ws>/.werkmeister/bin/with-temp-home --no-wait node --test <file>.test.mjs` (<ws> is this workspace's folder); this form asks first (SW-510); the wrapper points WERKMEISTER_HOST at a dead address only when your shell exports none, so `unset WERKMEISTER_HOST` first (SW-264);
      set HOME on that call only, never for the whole shell (it breaks `pnpm build`).
      Then build, and exercise the built CLI through `.werkmeister/bin/with-fixture-workspace` (SW-292): it runs this worktree's own `apps/cli` build against a seeded fixture workspace in a temp folder, removed on exit,
      with a temp HOME and registry (a `lib` service at `packages/lib`), a workspace folder that is a git repo on `me/demo` with its own local origin (so `pr open` pushes the record), a code repo `app` on branch `me/demo` whose origin is a local bare repo, `WERKMEISTER_FIXTURE=1`, logging fakes for gh and docker, and dead Docker and daemon addresses.
      Usage: `with-fixture-workspace [--no-wait] [--gate] [--bare] [--daemon] [--exec-runs] [--merged] [--issue <ref>] [--pr-field <key>=<value>]... [--workspace <file>] [--services <file>] [--fragment <file>] [--print <file>]... <werkmeister args> [--then <werkmeister args>]...`. Fixture options come first: the first other argument starts the werkmeister args.
      Each step runs from the fixture workspace and the run stops at the first failure; then it prints each `--print` file (relative to the workspace; a path outside it is not printed) and every fake gh and docker call.
      Start the command with the script itself, no env assignments and no `cd`: its allow rule matches that shape only.
      `with-temp-home` also unsets `CLAUDECODE` and `CLAUDE_CODE_*` (keeps `CLAUDE_BIN`), so a `claude` run under it sees what CI sees; outside the wrapper use `env -i PATH=… HOME=…`.
      `--services <file>` copies your registry in, from a file under the current folder (pass `workspace init --services <svc>` to pick from it). Keep it minimal, only the services under test (path, type, archetype, test, validate, ports): the repo's own `.werkmeister/services.yaml` fails init on a service that is not local and has no upstream. `--bare` leaves out the feature, so close-out skips teardown and the tracker; close it out with `workspace close --no-pr "<reason>"`;
      `--gate` adds an approved PR file, `origin/main` and a committed one-file change in `packages/lib`, and the fake docker reports `demo-lib` running, so the gate execs `lib`'s test and logs it; with `--services` the registry must keep `lib` in repo `app` at `packages/lib`, or the run exits 2.
      `--merged` makes the fake gh report the opened PR merged, so `--gate --merged workspace init --no-build --then pr open --then pr status --then workspace close --yes --skip-postmortem fixture` runs to the end and exits 0, its teardown in the docker calls (SW-482). `--issue o/app#1` (or `issue_id` / `group: [o/app#2]` in a `--workspace` file, refs `o/<repo>#N`) seeds an issue the fixture's GitHub project resolves to the fake gh, so `issue start`, `pr open`, `pr status` and `workspace close` show their moves (`gh issue edit` / `close` / `comment`, one per lead and member) in `--- gh calls` (SW-509); Jira keys still resolve to Jira.
      `--daemon` points `WERKMEISTER_HOST` at a fake daemon that logs each call (printed as `--- daemon calls`) and fails every tool; without it the daemon address is dead, even when your shell exports the real one.
      Pass `workspace init --context-strategy icm` for a fixture with `stages/`: without it a bare fixture gets the jit strategy.
      `--workspace <file>` merges a YAML mapping from a file under the current folder into the fixture's workspace.yml (e.g. `group: [SW-2]`, `work_type`, `context_strategy: icm`); with `context_strategy: icm`, `--gate` puts its PR file, exercise.md and review.md in the propose stage's output and fills each earlier stage's, so a grouped icm `workspace init --no-build --then pr gate` passes with no hand edit (SW-464). A `## Run limits` section in BRIEF.md needs `--autonomous` (or `autonomous: true`) and a `starting_prompt` or `description` in that file; with neither, BRIEF.md is the placeholder and has no Run limits. Group keys are kept as written and named in the contracts whatever the tracker; the fixture's tracker is Jira, so use `SW-2`-style keys when a check needs them parsed (SW-524).
      A change to `pr gate`, `pr open` or `runGate` is exercised that way: `with-fixture-workspace --gate workspace init --no-build --then pr gate` (the gate needs init's compose.yml); `pr open` there pushes to the local origin and opens through the fake gh.
      By default that run checks the gate's own flow, not a repo's rows: the fake docker logs every `docker exec` (the lint row and each service's `test:`) and answers 0, so `lint: "false"` passes too.
      Add `--exec-runs`, first among the fixture options, and the fake docker runs each exec's command with `sh -c` on the host, in the fixture's code repo `app` with the fixture's temp HOME, and returns its exit code, so a registry row fails and passes for real (SW-267, SW-473). It runs whatever the `--services` rows say, so Claude Code asks before each such run: `with-fixture-workspace --exec-runs --gate --services <file> workspace init --services lib --no-build --then pr gate` exits 1 with `✗ lint: false → exit 1` for `repos.app.lint: "false"`, and 0 for `"true"`; `lib`'s `test:` likewise. Copy the rows under test from your fragment into `<file>`; the command runs on the host, in a repo holding only the gate's one-file change, so a row that needs the real repo (its `node_modules`, a build) still needs the real gate, `werkmeister pr gate`, from the real workspace.
      To read the werkmeister-context.md a services.yaml renders, without the real registry: `with-fixture-workspace --services <file> --print .werkmeister/werkmeister-context.md workspace init --services <svc> --no-build`.
      A core test gets the same fixture in-process from `withFixtureWorkspace(fn, { gate, bare, services, daemon, execRuns, workspace, merged })` in `packages/werkmeister-core/fixtures.mjs`, and a fake daemon that answers tools from `withFakeDaemon(fn, { <tool>: <result> })` (pass its `daemon.url` as `daemon`).
      Record one passing and one failing case in exercise.md (e.g. `lint: pnpm exec biome ci .` → exit 0, and exit 1 with an over-width line left uncommitted).
      `werkmeister pr open` runs the globally installed CLI, built from main, so it would check the PR with the old gate.
      Assert on exit code, stdout/stderr and the printed files.
      A real `feature up` needs the real docker and is no fixture run: `WERKMEISTER_REAL_DOCKER=1` runs `real-docker-cycle.test.mjs` in packages/werkmeister-core (init, up, HTTP 200, stop, down on nginx:alpine; SW-284). Ask the person before the first real run.
      `registry sync`: `with-fixture-workspace --fragment <file> registry sync` copies the fragment to the fixture's `<repos_root>/app/.werkmeister/services.yaml`; check its output (`generated … from 1 fragment`).
      Set `WERKMEISTER_NO_WAIT=1` (or pass `--no-wait` first): `with-temp-home`, and a `pr gate` or `pr open` under it, otherwise wait for host load, up to 90 s each for `with-temp-home` and up to 10 min for the gate (180 s seen; `registry sync` ~195 s). Or run the exercise in the background.
      Any command that can write (to the workspace, its issue or its PRs) runs against the fixture workspace, except the proxy or routing recipe below, which needs the real Docker and Caddy;
      only read-only commands (e.g. `werkmeister skills check`) may run from the real workspace.
      A path that spawns `claude` (e.g. a `pr watch` wake): set `CLAUDE_BIN` to a wrapper that runs the real `claude` with the real HOME (`HOME=<real home> exec <claude> "$@"`), since the temp HOME has no login; symlink `<real>/.claude/projects` to `$HOME/.claude/projects`; `touch -t` the fixture transcript back more than 5 minutes (a session changed within 5 minutes reads as busy and the wake is held); make the fixture session with `claude -p --model haiku --output-format json "Say ok."` in the fixture folder and set `model: haiku` in its `workspace.yml`.
      Reproduce a load flake by simulating the slow dependency, never by loading the shared host: a `docker` stub that sleeps plus `DOCKER_HOST` at a unix socket that accepts and never answers (path under 104 bytes, so `mktemp -d /tmp/…`). If a loaded run is still needed, wrap it in a hard timeout and keep the load self-ending.
      CLI↔daemon change (`daemon_client.ts`, `scheduler_client.ts`, a daemon tool): use a foreground fake daemon on a temp HOME, never the host's daemon and never a background process (`pkill` is blocked). One node script: call `ownScheduler()` from `packages/werkmeister-core/dist/scheduler_client.js` before importing the MCP server; serve `POST /api/tool` on port 0 from `connectInMemoryClient(createServer({ scheduler: true }))` of `apps/werkmeister-mcp/dist/main.js` (`createServer()` acts as a daemon without the scheduler tool); write `$HOME/.werkmeister/mcp-token`; run the built CLI with `WERKMEISTER_HOST` pointing at it; close the server.
      Daemon self-restart across a rebuild (SW-306 guard): after a build, run `with-temp-home --no-wait node apps/werkmeister-mcp/scripts/exercise-rebuild.mjs <worktree>` (SW-429); it runs this worktree's own daemon on port 3902 (never 3002) under a node restart loop with `XPC_SERVICE_NAME=com.werkmeister.daemon` (a bash loop or a `detached` spawn resets it to `0` on macOS, so the guard never exits), points the proxies' `WERKMEISTER_HOST` at it (with-temp-home pins it to a dead port), and exits 0 once both sessions see `list_changed` and the new tool text.
      Generated-devcontainer change (`devcontainer_gen.ts`): generate with this branch's `buildDevcontainer` (`packages/werkmeister-core/dist/devcontainer_gen.js`) into a temp folder, never by rerunning `workspace init` on a real workspace (it rewrites the stage contracts). To run it: `npx @devcontainers/cli@0.89.0 up --workspace-folder ~/features/<ws> --config <tmp>/devcontainer.json` (0.80.0 hangs on OrbStack). It needs a real workspace under the workspaces root, because the host daemon issues `.werkmeister/token` only there (check it still exists right before starting). Call the daemon as Claude would without a login: run the `headersHelper` from the container's `~/.claude.json` and POST JSON-RPC to `http://host.docker.internal:3002/mcp` (initialize, then tools/call; `status` ignores a workspace argument, `services` takes one, for a cross-workspace scope check). With a token: `devcontainer exec … claude -p "<call a werkmeister tool>" --allowedTools mcp__werkmeister__status`. Clean up: `docker rm -f` by the labels `devcontainer.local_folder=<ws>` and `devcontainer.config_file`, then any test volume.
      Harness adapter change (adding or changing a harness under `packages/werkmeister-core/src/harness/`, or the plugin or CLI command it drives; SW-484). Research stage: before `decisions.md` has any `status: decided` entry, install or locate the harness binary (note the path), record its version (`<bin> --version`), and check every CLI command, flag, plugin API and event name a decision relies on against that binary: `<bin> <cmd> --help` for commands and flags, a real plugin load (the plugin runs and the event fires) for plugin APIs and event names. The docs alone do not count (SW-385: the docs promised V1 `server()` plugins and `opencode export`; the installed 2.2.5 had neither). `decisions.md` names the version checked and, beside each fact a decision rests on, the command that confirmed it and its result; a fact the binary does not confirm is rewritten or marked `unverified: docs only`, and no decision may rest on it. If the binary cannot be installed in this run, say so under `## Recommendations for reviewer` and mark every harness fact `unverified`. The same rule is in `docs/harnesses.md` § Adding a harness adapter.
      Proxy or routing change (the one writing recipe run from the real workspace): routes come from container labels over the Docker API, so `WERKMEISTER_DOCKER_BIN` cannot fake them and a temp-HOME fixture never touches the real Caddy. From the real workspace start an on-demand routable service with the branch build (`WERKMEISTER_ROOT=<worktree>/apps/cli node apps/cli/dist/main.js feature up --service <svc>`), assert the Caddyfile mtime and the `@feat<N>_<feature>` block, then `curl https://<host>` with the `X-Feature` cookie and compare with `localhost:<port>`. Clean up with `werkmeister feature stop`, not `docker rm -f` (that leaves a stale route until `infra proxy-reload`).
      Before a throwaway commit (a dirty-tree or docs-only commit made only to exercise a build or the gate), record `BASE=$(git rev-parse HEAD)` and undo with `git reset --soft "$BASE"` and `git checkout "$BASE" -- <files>`. Never undo against `origin/main` or another remote ref: `issue start`, `feature up` and `pr gate` fetch origin, so it moves during the run.
      After editing a `*.help.md` or a command's option text (`main.ts`), run `pnpm run docs:gen` (man pages and the users-guide CLI reference) and commit the regenerated files before the lint chain; `docs:check` fails otherwise.
      A new or changed CLI flag or command namespace also needs `pnpm exec vitest run src/__tests__/spellings.test.ts -u` in `apps/cli` (the snapshot holds every namespace key; a new spelling must carry every key of the deprecated one it replaces).
      A new CLI flag also needs its key in that command's `namespace` whitelist in `apps/cli/src/main.ts` and a `__parse` case in `apps/cli/src/__tests__/spellings.test.ts`; without it the flag parses but never reaches `run()`.
      A `pr_rules.ts` change needs `UPDATE_SNAPSHOT=1 node --test strategy-jit-snapshot.test.mjs` in `packages/werkmeister-core`, run through `with-temp-home`.
      The same regeneration applies to any generated-text change (a skill or a stage contract): the file is `packages/werkmeister-core/strategy-jit.snapshot.json`.
      Format only the files you touched (`pnpm exec biome check --write <files>`), never a folder: a folder-wide write rewrites files the change does not own. Judge `biome ci` by its exit code, not its diagnostic count.
      On a rebase conflict in `strategy-jit.snapshot.json` (it embeds all of `pr-rules.md` on one line, so any two PRs touching `pr_rules.ts` conflict), take main's copy (`git checkout --ours` during a rebase), rebuild, regenerate with `UPDATE_SNAPSHOT=1`; never hand-merge the JSON line.
      `pnpm changeset status --since=origin/main` sees only committed files: a new `.changeset/*.md` reads as `no changesets were found` until it is committed. Check it after committing the changeset, or run `git add -N <file>` first (then `git reset <file>`).
    internal_port: 3998
    port_offset: 3
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/cli && exec pnpm run watch"
    memory_limit: 2G
    # SW-283: cold gate row peaks at 948 MiB anon (2026-11-05); +15%, 64M steps.
    memory_reservation: 1088M
    node_modules_volume: node-modules
    extra_volumes: &host_mounts
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{werkmeister_home}}:{{werkmeister_home}}"
      - "{{repos_root}}:{{repos_root}}"
      - "{{workspaces_root}}:{{workspaces_root}}"
      - "{{home}}/.kube:{{home}}/.kube:ro"
      - tools:/opt/werkmeister-tools
    environment: &host_env
      HOME: "{{home}}"
      PATH: /app/apps/cli:/opt/werkmeister-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DOCKER_CONFIG: /opt/werkmeister-tools/docker
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # SW-31: pnpm is corepack's shim in the tools volume (werkmeister-install puts
      # it there); the pnpm version it fetches lives there too, so it downloads
      # once per feature, without the prompt that would hang a container.
      COREPACK_HOME: /opt/werkmeister-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Read by werkmeister-dashboard; harmless for the others.
      HOST: 0.0.0.0

  werkmeister-core:
    path: packages/werkmeister-core
    type: library
    archetype: node-tool
    test: "pnpm turbo run typecheck test --continue --filter=werkmeister --filter=werkmeister-mcp --filter=werkmeister-core"
    # Bundled into the CLI, so a core change is exercised through the built binary, not node-tool's "run the tests".
    validate: *cli_validate
    internal_port: 3999
    port_offset: 2
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd packages/werkmeister-core && exec pnpm exec tsc --watch --preserveWatchOutput"
    # SW-406: the gate row's typecheck, core and mcp suites share this container.
    cpus: "3"
    memory_limit: 2G
    memory_reservation: 768M
    node_modules_volume: node-modules
    # Same host access as cli: the repos mount makes the worktree's .git
    # resolve, and the socket + tools let its docker tests run (#134).
    extra_volumes: *host_mounts
    environment: *host_env

  # Also the MCP client bed: WERKMEISTER_MCP_TOKEN arrives via the feature .env
  # (a missing one makes `werkmeister feature up` refuse the workspace). Its archetype
  # no longer wires the werkmeister server into the shared .mcp.json (SW-115).
  # It has cli's host access too, so its tests can use docker directly (#134).
  werkmeister-vscode:
    path: packages/werkmeister-vscode
    type: extension
    archetype: mcp-client
    test: "pnpm turbo run typecheck test --continue --filter=werkmeister-vscode"
    validate: "Fresh worktree (no node_modules, no dist/): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION), then `pnpm turbo run build --filter=werkmeister-vscode` before the first test. Then build, run npm run test:integration (Extension Development Host via @vscode/test-cli), and walk the open items in MANUAL-CHECKLIST.md for anything visual. To try a dev build without installing it: `pnpm --filter werkmeister-vscode run build`, then `code --new-window --extensionDevelopmentPath=packages/werkmeister-vscode` with no folder argument (a folder already open in another window makes the dev host close itself), then drive it, e.g. for a URI handler `open 'vscode://jbbz.werkmeister-vscode/…'` (VS Code asks to allow the URI the first time). `vsce package` builds the installable .vsix; the installed extension is replaced only by `code --install-extension`."
    internal_port: 3997
    port_offset: 4
    health_endpoint: /
    setup_service: werkmeister-install
    # Dockerfile adds xvfb and Electron's libs; the stock image makes
    # test:integration exit 127 (SW-62). The tag is local, never pulled.
    image: werkmeister-vscode:local
    dockerfile: Dockerfile
    command: "cd packages/werkmeister-vscode && exec pnpm run watch"
    memory_limit: 2G
    memory_reservation: 640M
    node_modules_volume: node-modules
    extra_volumes: *host_mounts
    environment: *host_env
    secrets: [WERKMEISTER_MCP_TOKEN]

  # Serves the workspace dashboard + MCP endpoint; its tools shell out to the
  # CLI, docker and kubectl, so it gets the same host access as `cli`.
  werkmeister-dashboard:
    path: apps/werkmeister-dashboard
    type: web
    archetype: node-web
    test: "pnpm turbo run test --continue --filter=werkmeister-dashboard"
    validate: "Fresh worktree (no node_modules, no dist/): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION), then `pnpm turbo run build --filter=werkmeister-dashboard` before the first test. Then check the URL health (see Quick Health Checks)."
    internal_port: 3001
    port_offset: 5
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/werkmeister-dashboard && exec pnpm run dev"
    memory_limit: 2G
    memory_reservation: 640M
    node_modules_volume: node-modules
    extra_volumes: *host_mounts
    environment: *host_env
    # werkmeister-dashboard.<local_domain> — local only; nothing runs in the cluster.
    feature_router: {}

  # The public docs site (SW-80): VitePress dev server over the repo's docs, in
  # place, with hot reload. It shells out to nothing, so it gets only the tools
  # volume (pnpm for the gate's test) and the repos mount (git for turbo), not
  # cli's host access.
  docs-site:
    path: apps/docs-site
    type: web
    archetype: node-web
    test: "pnpm turbo run test --continue --filter=docs-site"
    validate: "Fresh worktree (no node_modules, no dist/): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION), then `pnpm turbo run build --filter=docs-site` before the first test. Then open the page and the sidebar entry for the doc you changed; `pnpm --filter docs-site build` fails on a dead link."
    internal_port: 5173
    port_offset: 6
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/docs-site && exec pnpm exec vitepress dev . --host 0.0.0.0 --port 5173"
    # 2G, above the others' 1G: the gate can run cli's cold typecheck + test here
    # (~900M) beside the dev server (~220M); 512M and 1G OOM-killed it (SW-128).
    memory_limit: 2G
    memory_reservation: 768M
    node_modules_volume: node-modules
    extra_volumes:
      - tools:/opt/werkmeister-tools
      - "{{repos_root}}:{{repos_root}}"
    environment:
      PATH: /opt/werkmeister-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      COREPACK_HOME: /opt/werkmeister-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Vite refuses unknown Host headers; this lets Caddy's hostname through.
      # Registry sync fills in this machine's local_domain from config.yaml.
      DOCS_ALLOWED_HOSTS: ".{{local_domain}}"
    # docs-site.<local_domain>/
    feature_router: {}

setup_services:
  # The werkmeister repo's install + build + tools download, all in startup.sh
  # (infra/compose/scripts/werkmeister-install-startup.sh). The build runs so
  # werkmeister-core/dist exists before the app services start; the `tools` volume
  # gets docker/compose/kubectl and the pnpm shim for the host-access services.
  # SW-31: `pnpm install --frozen-lockfile` (`npm ci` for a branch still on
  # package-lock.json) never rewrites the lockfile, so an up can't dirty the
  # worktree (#148).
  # SW-33: the install is skipped while the lockfile and Node major are unchanged.
  # ~/repos and safe.directory give git the same access as the app containers,
  # so turbo hashes inputs the same way they do. ~/.werkmeister/locks queues
  # installs host-wide, WERKMEISTER_INSTALL_SLOTS (default 2) at a time, and builds
  # one at a time.
  # SW-69: the turbo cache and pnpm store are the built-in `turbo` and
  # `pnpm-store` caches, attached here and to the app services by turbo.json and
  # pnpm-lock.yaml. See them with `werkmeister feature status`; clear them with
  # `werkmeister cache prune`.
  werkmeister-install:
    image: node:22
    command: "sh /usr/local/bin/startup.sh install"
    node_modules_volume: node-modules
    startup_script: true
    extra_volumes:
      - tools:/opt/werkmeister-tools
      - "{{repos_root}}:{{repos_root}}"
      - "{{werkmeister_home}}/locks:/locks"
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      COREPACK_HOME: /opt/werkmeister-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
