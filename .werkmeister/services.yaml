# Werkmeister service-registry fragment for this repo.
#
# `werkmeister registry sync` (run by `werkmeister machine setup`) merges every
# <repo>/.werkmeister/services.yaml under paths.repos_root into
# ~/.werkmeister/services.yaml. Only `services:`, `setup_services:`,
# `infrastructure:` and `repo:` (this repo's own settings, merged into
# `repos.<dir>`) may appear here; the repo key is the checkout's directory name
# and the rest of `repos:` is derived. {{home}}, {{repos_root}}, {{workspaces_root}},
# {{werkmeister_home}} (the tool's home folder) and {{local_domain}} expand at merge time. `x-` keys hold YAML
# anchors and are dropped from the output.

# Ship detection for `werkmeister pr status` and the pre-PR gate's release check
# (docs/workspace-lifecycle.md): changesets publishes and tags each release, so
# a merge has shipped once a werkmeister release tag contains it.
repo:
  ship: tag
  release_tag: "werkmeister@*"
  release_check: pnpm changeset status --since=origin/main
  # CI's `test` job checks that need no display: licences, format, typedoc links, generated docs, the old name; the gate runs
  # them so each fails before the PR opens (SW-133, SW-225, SW-252, SW-312). docs:check reads the built CLI and core.
  # Left out: vscode test:integration and package (need xvfb and a downloaded VS Code), typecheck/test (the services' `test:`).
  # SW-226: --diagnostic-level=error keeps the exit code but prints only errors, so a format error is not buried under warnings.
  # SW-646: the implement contract runs this on the files it touched before tests (was hard-coded there).
  format: pnpm exec biome check --write {files}
  # SW-636: werkmeister-context.md runs this ahead of each test command. Measured warm in the werkmeister-core container,
  # a format error fails it in ~7 s (licenses 2.7 s + biome ci 4.4 s), before docs:links (10.9 s) or docs:sdk (9.2 s).
  lint: pnpm run licenses && pnpm exec biome ci --diagnostic-level=error . && pnpm --filter werkmeister-core run docs:links && pnpm --filter werkmeister-core run docs:sdk && pnpm turbo run build --filter=werkmeister && pnpm run docs:check && pnpm run name:check
  # Changes here touch no service, so the gate runs no service tests for them.
  # scripts/: its tests and checks all run in the lint row above (licenses, docs:check, name:check); SW-563.
  # Anything else outside a service's `path` still touches every service, and the gate's tests row names it.
  # packages/werkmeister-ui stays unmapped on purpose: the dashboard, the MCP app and the vscode extension all import it.
  no_service_paths: [.changeset, .gitignore, README.md, .github, .vscode, .claude, scripts, bin, LICENSE, NOTICE, .git-blame-ignore-revs]
  # SW-450: paths no service owns by path, so a change there doesn't test every service.
  path_mappings:
    apps/cli: werkmeister-core # core is bundled into the CLI, so one row tests both; core's `test:` has the filters
    apps/werkmeister-mcp: werkmeister-core # ships inside the CLI (dist/mcp.js)
    docs: docs-site # SW-644: the site builds from docs/, so a docs change runs its build and dead-link check
    plugins: werkmeister-core # plugin tests live in core; core's row also runs the plugin's typecheck + test (SW-580)
  # Tracker components: one per ticket, the subsystem its fix lands in. Backlog triage sets them and groups tickets
  # by them (one workspace and PR per group). Each project lists its own here; werkmeister has no built-in list.
  # A new component is a change to this map, never a name made up in the tracker.
  components:
    gate: pr gate, pr open checks, test rows, gate speed
    scheduler: capacity queue, host-load waits, feature up admission, preemption
    test-harness: with-temp-home, with-fixture-workspace, run-tests.sh, fixtures
    metrics: event log, usage and cost numbers, Flow tab data
    docs: docs-site, SDK docs, screenshots
    setup: machine setup, install, certs, demo apps, config location
    release: changesets, publish, pr status shipped checks
    permissions: autonomous run limits, ask rules, hooks
    contracts: generated ICM stage-contract and pr-rules text, generated skills
    workspace: workspace create/init/close, issue commands, PR lifecycle
    ui: VS Code extension, dashboard, workspaces pane
    infra: containers, Caddy, shared infra, daemon, MCP proxy

services:
  # --- The werkmeister repo's own workspaces (self-hosting) -----------------------
  # All of them share one repo bind mount at /app and one per-feature node_modules
  # volume; werkmeister-install populates it and builds werkmeister-core/dist first.
  # 2G each (3G for werkmeister-core): the pre-PR gate runs cli's cold typecheck + test (~900M anon) in any of
  # them, beside the dashboard's dev server (~180M); 1G left no headroom (SW-130,
  # SW-128), and the dashboard's build runs out of heap at 512M.
  # werkmeister-core and werkmeister-vscode (types library/extension) idle under
  # `sleep infinity` with no healthcheck; their `command:` watchers run only under
  # `werkmeister feature up --dev`. The port is still published, so they keep their slot.
  # See docs/configuration.md "Self-hosting the Werkmeister repo" in the werkmeister repo.
  # werkmeister-core runs a fully functional CLI: the host's docker socket plus ~/.werkmeister, ~/repos,
  # ~/features and ~/.kube mounted at their host paths, because the compose
  # files it generates carry host bind-mount paths and the daemon is the
  # host's. HOME matches so `~` expands the same way; PATH puts the worktree's
  # own `werkmeister` wrapper first (the dogfood point) and the tools volume next.
  # GIT_CONFIG_* marks every directory safe: the worktrees belong to the host
  # uid, and git refuses "dubious ownership" otherwise. The anchors below are
  # reused by every other service here, so this entry must stay above them.
  werkmeister-core:
    # SW-604, SW-683: lsof (pause-resume's resumeAndNudge tests) comes from the tools volume, filled by werkmeister-install's
    # startup.sh; this row also runs on the host as a pre-approved command, so it installs nothing.
    path: packages/werkmeister-core
    type: library
    archetype: node-tool
    # apps/cli and apps/werkmeister-mcp have no service of their own (path_mappings above): this row tests them, since core is
    # bundled into both, and a second container ran the same suites twice whenever a change touched core and the CLI.
    # SW-723: no lint steps here; werkmeister-context.md puts repo.lint ahead of this line (SW-636) and the gate runs it as its own row.
    test: "pnpm turbo run typecheck test --continue --filter=werkmeister --filter=werkmeister-mcp --filter=werkmeister-core --filter=werkmeister-plugin"
    # SW-143: the ICM exercise step defers to this text for a CLI, so the whole recipe lives here.
    validate: >-
      In this repo the host checkout has no node_modules (`tsc: command not found`, `ERR_MODULE_NOT_FOUND: dockerode`), so run every command below, the install, the build, the tests and `with-fixture-workspace`, through `docker exec -w /app/<path> <container> <command>` (container names are in `werkmeister-context.md`),
      after `werkmeister feature up --service <name>`: starting this workspace's own container is expected for implement and exercise and allowed. Inside the container HOME is still the host's, with the real `~/.werkmeister` mounted read-write, so a test you run there goes through `<ws>/.werkmeister/bin/with-temp-home` too (<ws> is this workspace's folder, mounted at the same path). None of these `docker exec` forms is pre-approved: approve each run, never a `docker exec` prefix (the container holds the Docker socket and every workspace).
      Fresh worktree (no node_modules, no dist/): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION),
      then `pnpm turbo run build --filter=werkmeister` before the first test: it builds the CLI, and `apps/cli/dist/main.js` bundles werkmeister-core, so building core alone leaves the CLI stale.
      Run it as `node apps/cli/dist/main.js`, not `node apps/cli/werkmeister` (a bash wrapper: `SyntaxError: Invalid or unexpected token`).
      A plugin typecheck failure seen only with the host's newer Claude Code (the container and CI pin an older one): regenerate the mod types for that version in the container, `docker exec -w /app/plugins/werkmeister <container> <ws>/.werkmeister/bin/with-temp-home --no-wait env CLAUDE_CODE_VERSION=<host's claude --version> node scripts/gen-types.mjs`, then `docker exec -w /app/plugins/werkmeister <container> pnpm exec tsc -p . --noEmit` (SW-732; npx downloads that version, so it needs network).
      Fast route for a core-only change, once the install and build above have run (a fresh worktree fails ERR_MODULE_NOT_FOUND for dist/config.js without them): `docker exec -w /app/packages/werkmeister-core <container> <ws>/.werkmeister/bin/with-temp-home --no-wait node --test <file>.test.mjs`, or, for the tests a change reaches, `docker exec -w /app/packages/werkmeister-core <container> <ws>/.werkmeister/bin/with-temp-home --no-wait pnpm run test:changed` (tests load `dist/`, so rebuild after a `src/` edit; it falls back to the full suite when it can't map a change).
      A `node --test` probe of core `dist/` that `with-fixture-workspace` doesn't reach (scheduler, grant, capacity hook) takes its setup from `/app/packages/werkmeister-core/test/fixtures.mjs`, as the core tests do (SW-849): `withSandboxHome(fn, { services, ports, config })` writes a temp `config.yaml` (`WERKMEISTER_CONFIG_FILE`) with `services.yaml` and `ports.yaml` beside it, and `pinWerkmeisterRoot()` at the top level sets `WERKMEISTER_ROOT=/app/apps/cli` and `WERKMEISTER_ROOT_PINNED=1` (without them `sandboxRoot()` throws under `node --test`, SW-239). A probe that spawns the built CLI (`/app/apps/cli/dist/main.js`) drops `NODE_TEST_CONTEXT` from the child env, `const { NODE_TEST_CONTEXT: _, ...env } = process.env`, and passes `env`: the child inherits it from `node --test`, so the same guard throws in the CLI (SW-867).
      For a scheduler or preemption path also fake Docker as `test/pause-resume.test.mjs` does: an Engine API on a unix socket (set `DOCKER_HOST=unix://…` before `useDockerEngine()`, which sets `WERKMEISTER_DOCKER_ENGINE=1`: the opt-in alone lifts the dead-socket guard onto the host's engine) and a logging `docker` script as `WERKMEISTER_DOCKER_BIN` (a fake first on `PATH` loses to `/usr/bin`, which `childEnv()` puts ahead of it). Never the real daemon: the container reaches the host's, and a real preemption stops other workspaces' containers.
      Then build, and exercise the built CLI through `.werkmeister/bin/with-fixture-workspace` (SW-292), in the container too: `docker exec -w /app <container> <ws>/.werkmeister/bin/with-fixture-workspace --no-wait <args>` (the script runs the CLI at /app, where its node_modules is, and from the host it exits 2 naming this form, SW-548; `--no-wait` skips a load wait that would read the host's `~/.werkmeister`). Put any `--workspace`, `--services` or `--fragment` file in the worktree's `.werkmeister/fixture/` (gitignored; not `.werkmeister/services.yaml`, which is tracked), since it must sit under the current folder, /app. A `--print stages/01_reproduce/CONTEXT.md` check needs a bug-type icm fixture: put `context_strategy: icm` and `work_type: bugfix` (an unknown type silently gets the feature stages) in `.werkmeister/fixture/ws.yml` and pass `--workspace .werkmeister/fixture/ws.yml`, after the install and build above (without the build the script exits 2, "no built CLI"). When `with-fixture-workspace` cannot run there (no built CLI yet), the in-process check is `docker exec -w /app/packages/werkmeister-core <container> <ws>/.werkmeister/bin/with-temp-home --no-wait node --test test/strategy-icm-templates.test.mjs` (SW-578). It runs this worktree's own `apps/cli` build against a seeded fixture workspace in a temp folder, removed on exit,
      with a temp HOME and registry (a `lib` service at `packages/lib`), a workspace folder that is a git repo on `me/demo` with its own local origin (so `pr open` pushes the record), a code repo `app` on branch `me/demo` whose origin is a local bare repo, `WERKMEISTER_FIXTURE=1`, logging fakes for gh and docker, and dead Docker and daemon addresses.
      Usage: `with-fixture-workspace [--no-wait] [--gate] [--bare] [--daemon] [--exec-runs] [--merged] [--behind] [--slots-full] [--running <file>] [--queue <feature>[,<feature>]... | --queue <feature>:<waitedMin>[:<service>,...]]... [--issue <ref>] [--pr-field <key>=<value>]... [--pr-line '<key>: <value>']... [--workspace <file>] [--config <file>] [--services <file>] [--fragment <file>] [--change <path>] [--change-base <file>] [--change-branch <file>] [--fragment-change <file>] [--stale-compose] [--print <file>]... <werkmeister args> [--then <werkmeister args>]...`. Fixture options come first: the first other argument starts the werkmeister args.
      `--behind` pushes two commits to the code repo's origin/main after the branch is cut, so the branch is behind its base until a fetch (SW-669).
      Each step runs from the fixture workspace and the run stops at the first failure; then it prints each `--print` file (relative to the workspace; a path outside it is not printed) and every fake gh and docker call.
      Exercise a start path (`startService`, `up`, `prepareSlot`) through `composeUpServiceAsync`/admission with a fake, or through the host CLI, never by calling `startService` in-container: from inside, the werkmeister root is /app and a compose regeneration refuses (SW-554).
      `with-temp-home` also unsets `CLAUDECODE` and `CLAUDE_CODE_*` (keeps `CLAUDE_BIN`), so a `claude` run under it sees what CI sees; outside the wrapper use `env -i PATH=… HOME=…`.
      `--services <file>` copies your registry in, from a file under the current folder (pass `workspace init --services <svc>` to pick from it). Keep it minimal, only the services under test (path, type, archetype, test, validate, ports): the repo's own `.werkmeister/services.yaml` fails init on a service that is not local and has no upstream. `--bare` leaves out the feature, so close-out skips teardown and the tracker; close it out with `workspace close --no-pr "<reason>"`;
      `--gate` adds an approved PR file (`--pr-field status=<value>` replaces its `status:` line verbatim, e.g. `"status=approved  # approved via check-in 2026-11-06"`, SW-549; `--pr-field skip_release=<reason>` and the other skip fields add to its front matter, quoted where YAML needs it; `--pr-line 'skip_release: no changeset: test-only'` adds a line as written, so a test can seed the unquoted colon value the gate refuses, SW-851), `origin/main` and a committed one-file change in `packages/lib`, and the fake docker reports `demo-lib` running, so the gate execs `lib`'s test and logs it; with `--services` the registry must keep `lib` in repo `app` at `packages/lib`, or the run exits 2.
      `--change <path>` makes `--gate` change that file instead (e.g. `plugins/x/y.ts`, `docs/z.md`), to exercise a path mapping. `--fragment-change <file>` commits `<file>` as the code repo's `.werkmeister/services.yaml` on the branch, over a base fragment on main (`--fragment`'s, else one matching the default registry), and drops the `packages/lib` change unless `--change` names one: `--gate --fragment-change <file> workspace init --no-build --then pr gate` shows `fragment: .werkmeister/services.yaml changes lib` and runs only `lib`'s test (SW-664). Both need `--gate`. `--stale-compose` (with `--fragment-change`) runs `workspace init --no-build` before the branch's fragment lands, so compose.yml is stale against it as in a workspace inited before its change, and `pr gate` starts the service from `compose.gate.yml`: `--gate --fragment-change <file> --stale-compose pr gate` (SW-817). `--change-base <file>` and `--change-branch <file>` (with `--change`) put those files' text in the changed file on main and on the branch, instead of `base` and `changed`, e.g. two `pnpm-lock.yaml` copies (SW-696).
      `--merged` makes the fake gh report the opened PR merged, so `--gate --merged workspace init --no-build --then pr open --then pr status --then workspace close --yes --skip-postmortem fixture` runs to the end and exits 0, its teardown in the docker calls (SW-482). `--issue o/app#1` (or `issue_id` / `group: [o/app#2]` in a `--workspace` file, refs `o/<repo>#N`) seeds an issue the fixture's GitHub project resolves to the fake gh, so `issue start`, `pr open`, `pr status` and `workspace close` show their moves (`gh issue edit` / `close` / `comment`, one per lead and member) in `--- gh calls` (SW-509); Jira keys still resolve to Jira.
      `--slots-full` leases every fixture slot (all 4) to other features first, so a no-slot path runs through the built CLI: `with-fixture-workspace --slots-full --print compose.yml workspace init --no-build` exits 0, prints `the container step did not run` and has no compose.yml (SW-634).
      `--running <file>` seeds containers the scheduler reads from Docker, one `feature<TAB>workspace<TAB>startedAt<TAB>memoryBytes<TAB>nanoCpus` line each (the workspace is a folder name, created empty in the fixture, so its holder is a person's and never preempted), and `--queue <feature>[,<feature>]...` seeds `scheduler/queue.json`, so a capacity wait runs through the built CLI: with a `--config` file `budget: { cpus: 6 }` and a running file `holder<TAB>holder<TAB>2026-11-13T00:00:00Z<TAB>0<TAB>6000000000`, `workspace init --no-build --then feature up` exits 75 with `running: holder (6 CPUs, …)`, and `--queue demo … workspace init --no-build --then budget status` lists `holder` under Running and `demo` under Waiting (SW-685).
      A bare name has no wait, cost or services. `--queue <feature>:<waitedMin>[:<service>,...]` (repeat `--queue` for more waiters; in-process, the same string in `queue`) also gives that waiter a workspace folder with a compose.yml (1 CPU and 1 GiB per service, else one `app`), a lease in `scheduler/leases.json` and a `.werkmeister/waiting.json` whose `since` is that many minutes back (and `services`, a service start), so a starved, whole-feature or service head runs through the built CLI: `--config <budget: { cpus: 4 }> --queue head:239 workspace init --no-build --then budget status` lists `1. head  whole feature (1 CPUs, 1.0 GiB)  waited 239 min, gets the next free room`, and `head:239:api` lists it as an `api` start (SW-809). A service waiter's waiting.json is dropped as dead once it is 60 s old at an admission, so run the step that admits within a minute.
      `--daemon` points `WERKMEISTER_HOST` at a fake daemon that logs each call (printed as `--- daemon calls`) and fails every tool; without it the daemon address is dead, even when your shell exports the real one.
      `--config <file>` adds a YAML mapping's top-level keys, from a file under the current folder, to the fixture's config.yaml, e.g. `budget: { host_load: 0.01 }` for a budget or load path (`with-fixture-workspace --config <file> budget status` shows `host load 0.01`); any other key is refused, since `jira`, `github_ingest` or `paths` would reach real services or repos (SW-670).
      Pass `workspace init --context-strategy icm` for a fixture with `stages/`: without it a bare fixture gets the jit strategy.
      `--workspace <file>` merges a YAML mapping from a file under the current folder into the fixture's workspace.yml (e.g. `group: [SW-2]`, `work_type`, `context_strategy: icm`); with `context_strategy: icm`, `--gate` puts its PR file, exercise.md and review.md in the propose stage's output and fills each earlier stage's, so a grouped icm `workspace init --no-build --then pr gate` passes with no hand edit (SW-464). A `## Run limits` section in BRIEF.md needs `--autonomous` (or `autonomous: true`) and a `starting_prompt` or `description` in that file; with neither, BRIEF.md is the placeholder and has no Run limits. Group keys are kept as written and named in the contracts whatever the tracker; the fixture's tracker is Jira, so use `SW-2`-style keys when a check needs them parsed (SW-524).
      A change to `pr gate`, `pr open` or `runGate` is exercised that way: `with-fixture-workspace --gate workspace init --no-build --then pr gate` (the gate needs init's compose.yml); `pr open` there pushes to the local origin and opens through the fake gh.
      By default that run checks the gate's own flow, not a repo's rows: the fake docker logs every `docker exec` (the lint row and each service's `test:`) and answers 0, so `lint: "false"` passes too.
      Add `--exec-runs`, first among the fixture options, and the fake docker runs each exec's command with `sh -c` on the host, in the fixture's code repo `app` with the fixture's temp HOME, and returns its exit code, so a registry row fails and passes for real (SW-267, SW-473). It runs whatever the `--services` rows say, so Claude Code asks before each such run: `with-fixture-workspace --exec-runs --gate --services <file> workspace init --services lib --no-build --then pr gate` exits 1 with `✗ lint: false → exit 1` for `repos.app.lint: "false"`, and 0 for `"true"`; `lib`'s `test:` likewise. Copy the rows under test from your fragment into `<file>`; the command runs on the host, in a repo holding only the gate's one-file change, so a row that needs the real repo (its `node_modules`, a build) still needs the real gate, `werkmeister pr gate`, from the real workspace.
      To read the werkmeister-context.md a services.yaml renders, without the real registry: `with-fixture-workspace --services <file> --print .werkmeister/werkmeister-context.md workspace init --services <svc> --no-build`.
      A core test gets the same fixture in-process from `withFixtureWorkspace(fn, { gate, bare, services, daemon, execRuns, workspace, merged, slotsFull, containers, queue, fragmentChange, change, config })` in `packages/werkmeister-core/test/fixtures.mjs`, and a fake daemon that answers tools from `withFakeDaemon(fn, { <tool>: <result> })` (pass its `daemon.url` as `daemon`).
      Record one passing and one failing case in exercise.md (e.g. `lint: pnpm exec biome ci .` → exit 0, and exit 1 with an over-width line left uncommitted).
      A CPU or wall-time claim (SW-796's paired A/B runs) comes from `scripts/ab-row.sh` (SW-790), run on the host from this worktree with the container up: `sh scripts/ab-row.sh -o <dir in the workspace folder, outside the repo> [-n pairs] [-- <cmd>]`. It alternates base (A) and branch (B) rows, reverse-applies the base diff for A without moving HEAD, restores the tree and waits out load. Never take the base build by `git stash` (the stash stack is shared across worktrees) or by a checkout in this worktree (SW-813).
      `werkmeister pr open` runs the globally installed CLI, built from main, so it would check the PR with the old gate.
      Assert on exit code, stdout/stderr and the printed files.
      A real `feature up` needs the real docker and is no fixture run: `WERKMEISTER_REAL_DOCKER=1` runs `real-docker-cycle.test.mjs` in packages/werkmeister-core (init, up, HTTP 200, stop, down on nginx:alpine; SW-284). Ask the person before the first real run.
      A permission-rule change (allow, deny, ask) is checked against the real Claude Code matcher with an A/B probe (SW-822), never only the regex model in `workspace-permissions.test.mjs`: write each side's rules to a `settings.json` in a temp folder and run `claude -p --model haiku --setting-sources project --settings <dir>/settings.json --permission-mode default --output-format json "<run the command>"` once per side, reading `permission_denials` from the JSON. Pass `--settings`: Claude Code ignores `permissions.allow` from `.claude/settings.json` in a folder it has not trusted ("Ignoring … this workspace has not been trusted"), so both sides are denied and the probe proves nothing. Point the rule under test at a dummy wrapper script that only prints a marker, and put a broad allow beside it so the only denial is the rule's own. It needs a logged-in `claude`; from inside an agent session the probe may be refused, so leave the exact command for the person.
      `registry sync`: `with-fixture-workspace --fragment <file> registry sync` copies the fragment to the fixture's `<repos_root>/app/.werkmeister/services.yaml`; check its output (`generated … from 1 fragment`).
      Set `WERKMEISTER_NO_WAIT=1` (or pass `--no-wait` first): `with-temp-home` otherwise waits up to 90 s for host load (`pr gate` and `pr open` no longer wait, SW-542; `registry sync` ~195 s). Or run the exercise in the background.
      Any command that can write (to the workspace, its issue or its PRs) runs against the fixture workspace, except the proxy or routing recipe below, which needs the real Docker and Caddy;
      only read-only commands (e.g. `werkmeister skills check`) may run from the real workspace.
      A path that spawns `claude` (e.g. a `pr watch` wake): set `CLAUDE_BIN` to a wrapper that runs the real `claude` with the real HOME (`HOME=<real home> exec <claude> "$@"`), since the temp HOME has no login; symlink `<real>/.claude/projects` to `$HOME/.claude/projects`; `touch -t` the fixture transcript back more than 5 minutes (a session changed within 5 minutes reads as busy and the wake is held); make the fixture session with `claude -p --model haiku --output-format json "Say ok."` in the fixture folder and set `model: haiku` in its `workspace.yml`.
      Reproduce a load flake by simulating the slow dependency, never by loading the shared host: a `docker` stub that sleeps plus `DOCKER_HOST` at a unix socket that accepts and never answers (path under 104 bytes, so `mktemp -d /tmp/…`). If a loaded run is still needed, wrap it in a hard timeout and keep the load self-ending.
      A slow run of the plugin's real-time tests (pane timeouts; SW-703): throttle only this workspace's container, `docker update --cpus 0.3 <container>`, run the test, then restore it, `docker update --cpus <n> <container>`, with the service's own `cpus:` (3 for werkmeister-core; the host's CPU count for a service with none). Never `--cpus 0`: it leaves the limit in place. At 0.1 CPUs the suite hits the runner's whole-file limit; 0.3 reproduces the timeouts and finishes.
      Two throttle uses, never swapped (SW-838): `--cpus 0.3` (or a PATH stub) only to reproduce a starved spawn or a timeout; `--cpus 1` to prove a full suite passes under load. At 0.3 vitest's main process starves, so an RPC timeout fires and load-sensitive tests fail on any branch. An acceptance criterion that wants a green suite under load names `--cpus 1`.
      CLI↔daemon change (`daemon_client.ts`, `scheduler_client.ts`, a daemon tool): use a foreground fake daemon on a temp HOME, never the host's daemon and never a background process (`pkill` is blocked). One node script: call `ownScheduler()` from `packages/werkmeister-core/dist/scheduler_client.js` before importing the MCP server; serve `POST /api/tool` on port 0 from `connectInMemoryClient(createServer({ scheduler: true }))` of `apps/werkmeister-mcp/dist/main.js` (`createServer()` acts as a daemon without the scheduler tool); write `$HOME/.werkmeister/mcp-token`; run the built CLI with `WERKMEISTER_HOST` pointing at it; close the server.
      Branch daemon on the host (a daemon-auth or networking change, checked from a container via `host.docker.internal`; SW-679): after the build above, run on the host from the worktree root `node apps/werkmeister-mcp/scripts/host-daemon.mjs -- <command> [args]`. It copies this branch's `apps/cli` package to a temp folder with `node_modules` linked to the installed werkmeister's (`WERKMEISTER_MODULES=<dir>` picks another; it exits 2 naming a missing dependency), starts its `dist/mcp.js` on 127.0.0.1 at a free port (never 3002) with a temp HOME, a dead `DOCKER_HOST`, none of the caller's `WERKMEISTER_*` (the shell's env.sh paths would point it at real workspaces) and `WERKMEISTER_FIXTURE=1`, with `launchctl` and `crontab` stubbed to fail (they act on the real login session whatever HOME is), runs the command with `HOME`, `WERKMEISTER_HOST`, `WERKMEISTER_MCP_PORT` and `WERKMEISTER_MCP_TOKEN` set and the branch's `werkmeister` first on PATH, then stops the daemon, removes both folders and exits with the command's code.
      A container call: `node apps/werkmeister-mcp/scripts/host-daemon.mjs -- sh -c 'docker exec <container> curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $WERKMEISTER_MCP_TOKEN" http://host.docker.internal:$WERKMEISTER_MCP_PORT/api/status'` prints 200, and 401 without the header. With no command it runs in the foreground until interrupted: run that in the background and stop it by its PID. Never run `infra connect` or `infra restart` under it: they free the dashboard's fixed port 3001 by killing whatever holds it, the host's dashboard included.
      Daemon self-restart across a rebuild (SW-306 guard): after a build, run it in the container like every other step, as `docker exec -w /app <container> <ws>/.werkmeister/bin/with-temp-home --no-wait node apps/werkmeister-mcp/scripts/exercise-rebuild.mjs /app` (SW-429, SW-645: the host has no node_modules, so the host form fails ERR_MODULE_NOT_FOUND; run in the container it exits 0 with `PASS`, its daemon on the container's own port 3902); it runs this worktree's own daemon on port 3902 (never 3002) under a node restart loop with `XPC_SERVICE_NAME=com.werkmeister.daemon` (a bash loop or a `detached` spawn resets it to `0` on macOS, so the guard never exits), points the proxies' `WERKMEISTER_HOST` at it (with-temp-home pins it to a dead port), and exits 0 once both sessions see `list_changed` and the new tool text.
      Generated-devcontainer change (`devcontainer_gen.ts`): generate with this branch's `buildDevcontainer` (`packages/werkmeister-core/dist/devcontainer_gen.js`) into a temp folder, never by rerunning `workspace init` on a real workspace (it rewrites the stage contracts). To run it: `npx @devcontainers/cli@0.89.0 up --workspace-folder ~/features/<ws> --config <tmp>/devcontainer.json` (0.80.0 hangs on OrbStack). It needs a real workspace under the workspaces root, because the host daemon issues `.werkmeister/token` only there (check it still exists right before starting). Call the daemon as Claude would without a login: run the `headersHelper` from the container's `~/.claude.json` and POST JSON-RPC to `http://host.docker.internal:3002/mcp` (initialize, then tools/call; `status` ignores a workspace argument, `services` takes one, for a cross-workspace scope check). With a token: `devcontainer exec … claude -p "<call a werkmeister tool>" --allowedTools mcp__werkmeister__status`. Clean up: `docker rm -f` by the labels `devcontainer.local_folder=<ws>` and `devcontainer.config_file`, then any test volume.
      Harness adapter change (adding or changing a harness under `packages/werkmeister-core/src/harness/`, or the plugin or CLI command it drives; SW-484). Research stage: before `decisions.md` has any `status: decided` entry, install or locate the harness binary (note the path), record its version (`<bin> --version`), and check every CLI command, flag, plugin API and event name a decision relies on against that binary: `<bin> <cmd> --help` for commands and flags, a real plugin load (the plugin runs and the event fires) for plugin APIs and event names. The docs alone do not count (SW-385: the docs promised V1 `server()` plugins and `opencode export`; the installed 2.2.5 had neither). `decisions.md` names the version checked and, beside each fact a decision rests on, the command that confirmed it and its result; a fact the binary does not confirm is rewritten or marked `unverified: docs only`, and no decision may rest on it. If the binary cannot be installed in this run, say so under `## Recommendations for reviewer` and mark every harness fact `unverified`. The same rule is in `docs/harnesses.md` § Adding a harness adapter.
      Proxy or routing change (the one writing recipe run from the real workspace): routes come from container labels over the Docker API, so `WERKMEISTER_DOCKER_BIN` cannot fake them and a temp-HOME fixture never touches the real Caddy. From the real workspace start an on-demand routable service with the branch build (`WERKMEISTER_ROOT=<worktree>/apps/cli node apps/cli/dist/main.js feature up --service <svc>`), assert the Caddyfile mtime and the `@feat<N>_<feature>` block, then `curl https://<host>` with the `X-Feature` cookie and compare with `localhost:<port>`. Clean up with `werkmeister feature stop`, not `docker rm -f` (that leaves a stale route until `infra proxy-reload`).
      Before a throwaway commit (a dirty-tree or docs-only commit made only to exercise a build or the gate), record `BASE=$(git rev-parse HEAD)` and undo with `git reset --soft "$BASE"` and `git checkout "$BASE" -- <files>`. Never undo against `origin/main` or another remote ref: `issue start`, `feature up` and `pr gate` fetch origin, so it moves during the run.
      After editing a `*.help.md` or a command's option text (`main.ts`), run `pnpm turbo run build --filter=werkmeister`, then `pnpm run docs:gen` (man pages and the CLI reference in `docs/cli-reference.md`), in the container, and commit the regenerated files in that ticket's commit before the lint chain; `docs:check` fails otherwise (SW-830: docs:gen reads the built CLI, so a stale build regenerates the old text).
      Markdown a change adds or moves into the repo (a copied skill, doc or reference) is checked by `pnpm run docs:check` (after the build; it reads untracked files too) and `pnpm --filter werkmeister-core run docs:links` (TSDoc in `src` only): run both in the container in research, before the spec fixes the text.
      A new or changed CLI flag or command namespace also needs `pnpm exec vitest run src/__tests__/spellings.test.ts -u` in `apps/cli` (the snapshot holds every namespace key; a new spelling must carry every key of the deprecated one it replaces).
      A new CLI flag also needs its key in that command's `namespace` whitelist in `apps/cli/src/main.ts` and a `__parse` case in `apps/cli/src/__tests__/spellings.test.ts`; without it the flag parses but never reaches `run()`.
      A `pr_rules.ts` change needs `UPDATE_SNAPSHOT=1 node --test strategy-jit-snapshot.test.mjs` in `packages/werkmeister-core`, run through `with-temp-home`.
      The same regeneration applies to any generated-text change (a skill or a stage contract): the file is `packages/werkmeister-core/test/strategy-jit.snapshot.json`.
      Format only the files you touched (`pnpm exec biome check --write <files>`), never a folder: a folder-wide write rewrites files the change does not own. Judge `biome ci` by its exit code, not its diagnostic count.
      On a rebase conflict in `strategy-jit.snapshot.json` (it embeds all of `pr-rules.md` on one line, so any two PRs touching `pr_rules.ts` conflict), take main's copy (`git checkout --ours` during a rebase), rebuild, regenerate with `UPDATE_SNAPSHOT=1`; never hand-merge the JSON line.
      `pnpm changeset status --since=origin/main` sees only committed files: a new `.changeset/*.md` reads as `no changesets were found` until it is committed. Check it after committing the changeset, or run `git add -N <file>` first (then `git reset <file>`).
    internal_port: 3999
    port_offset: 2
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd packages/werkmeister-core && exec pnpm exec tsc --watch --preserveWatchOutput"
    # SW-854: autonomous runs start it without a prompt despite its host mounts.
    unattended_start: "Its command runs tsc from the frozen install; no package.json script the agent can edit, and tsc runs no project code."
    # SW-406: the gate row's typecheck, core, cli and mcp suites share this container.
    cpus: "3"
    # Measured 2026-11-12: a gate row peaked at 1.8 GiB (docker stats, page cache included) against the old 2G limit.
    memory_limit: 3G
    # SW-283: cold gate row peaks at 948 MiB anon (2026-11-05); +15%, 64M steps.
    memory_reservation: 1088M
    node_modules_volume: node-modules
    extra_volumes: &host_mounts
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{werkmeister_home}}:{{werkmeister_home}}"
      - "{{repos_root}}:{{repos_root}}"
      - "{{workspaces_root}}:{{workspaces_root}}"
      - "{{home}}/.kube:{{home}}/.kube:ro"
      - tools:/opt/werkmeister-tools
    environment: &host_env
      HOME: "{{home}}"
      PATH: /app/apps/cli:/opt/werkmeister-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DOCKER_CONFIG: /opt/werkmeister-tools/docker
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # SW-31: pnpm is corepack's shim in the tools volume (werkmeister-install puts
      # it there); the pnpm version it fetches lives there too, so it downloads
      # once per feature, without the prompt that would hang a container.
      COREPACK_HOME: /opt/werkmeister-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Read by werkmeister-dashboard; harmless for the others.
      HOST: 0.0.0.0

  # SW-583: the GitHub push-ingest infra (CDK + Lambda). Its tests synthesize the stack offline;
  # a real deploy needs AWS credentials and is a person's step (docs/github-ingest.md).
  github-ingest:
    path: apps/github-ingest
    type: library
    archetype: node-tool
    test: "pnpm turbo run test --continue --filter=github-ingest"
    validate: "Fresh worktree (no node_modules): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION), then the test command. `pnpm --filter github-ingest exec cdk synth` must print the template with no AWS credentials. Setup steps 1-3 in docs/github-ingest.md (deploy, the GitHub App, the `github_ingest:` block in ~/.werkmeister/config.yaml and `werkmeister daemon restart`) are a person's steps, never part of a run."
    internal_port: 3996
    port_offset: 7
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "sleep infinity"
    node_modules_volume: node-modules
    # Same tools and repo mount as docs-site, so pnpm resolves; no docker socket or HOME mounts.
    extra_volumes:
      - tools:/opt/werkmeister-tools
      - "{{repos_root}}:{{repos_root}}"
    environment:
      PATH: /opt/werkmeister-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      COREPACK_HOME: /opt/werkmeister-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

  # Also the MCP client bed: WERKMEISTER_MCP_TOKEN arrives via the feature .env
  # (a missing one makes `werkmeister feature up` refuse the workspace). Its archetype
  # no longer wires the werkmeister server into the shared .mcp.json (SW-115).
  # It has werkmeister-core's host access too, so its tests can use docker directly (#134).
  werkmeister-vscode:
    path: packages/werkmeister-vscode
    type: extension
    archetype: mcp-client
    test: "pnpm turbo run typecheck test --continue --filter=werkmeister-vscode"
    validate: "Fresh worktree (no node_modules, no dist/): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION), then `pnpm turbo run build --filter=werkmeister-vscode` before the first test. Then build, run `xvfb-run -a pnpm --filter werkmeister-vscode run test:integration` from the worktree root (Extension Development Host via @vscode/test-cli; without xvfb-run Electron exits with no display, SW-870), and walk the open items in MANUAL-CHECKLIST.md for anything visual. To try a dev build without installing it: `pnpm --filter werkmeister-vscode run build`, then `code --new-window --extensionDevelopmentPath=packages/werkmeister-vscode` with no folder argument (a folder already open in another window makes the dev host close itself), then drive it, e.g. for a URI handler `open 'vscode://jbbz.werkmeister-vscode/…'` (VS Code asks to allow the URI the first time). `vsce package` builds the installable .vsix; the installed extension is replaced only by `code --install-extension`."
    internal_port: 3997
    port_offset: 4
    health_endpoint: /
    setup_service: werkmeister-install
    # Dockerfile adds xvfb and Electron's libs; the stock image makes
    # test:integration exit 127 (SW-62). The tag is local, never pulled.
    image: werkmeister-vscode:local
    dockerfile: Dockerfile
    command: "cd packages/werkmeister-vscode && exec pnpm run watch"
    memory_limit: 2G
    memory_reservation: 640M
    node_modules_volume: node-modules
    extra_volumes: *host_mounts
    environment: *host_env
    secrets: [WERKMEISTER_MCP_TOKEN]

  # Serves the workspace dashboard + MCP endpoint; its tools shell out to the
  # CLI, docker and kubectl, so it gets the same host access as `werkmeister-core`.
  werkmeister-dashboard:
    path: apps/werkmeister-dashboard
    type: web
    archetype: node-web
    test: "pnpm turbo run test --continue --filter=werkmeister-dashboard --filter=werkmeister-ui"
    validate: "Fresh worktree (no node_modules, no dist/): run `pnpm install --frozen-lockfile` from the worktree root (cd there; `pnpm -C` makes corepack ignore the pinned pnpm and fail ERR_PNPM_BAD_PM_VERSION), then `pnpm turbo run build --filter=werkmeister-dashboard` before the first test. Then check the URL health (see Quick Health Checks)."
    internal_port: 3001
    port_offset: 5
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/werkmeister-dashboard && exec pnpm run dev"
    memory_limit: 2G
    memory_reservation: 640M
    node_modules_volume: node-modules
    extra_volumes: *host_mounts
    environment: *host_env
    # werkmeister-dashboard.<local_domain> — local only; nothing runs in the cluster.
    feature_router: {}

  # The public docs site (SW-80): VitePress dev server over the repo's docs, in
  # place, with hot reload. It shells out to nothing, so it gets only the tools
  # volume (pnpm for the gate's test) and the repos mount (git for turbo), not
  # werkmeister-core's host access.
  docs-site:
    path: apps/docs-site
    type: web
    archetype: node-web
    test: "pnpm turbo run test --continue --filter=docs-site"
    validate: "The host checkout has no node_modules (they are this feature's container volume, installed by werkmeister-install), so never install on the host: that would write host binaries beside the container's packages. Run the build and the test in the container, from /app: `docker exec -w /app <feature>-docs-site pnpm turbo run build --filter=docs-site`, then `docker exec -w /app <feature>-docs-site pnpm turbo run test --continue --filter=docs-site` (the gate's form; this container has no workspace mount, so no with-temp-home, and its tests read no HOME). `pnpm --filter docs-site build` (the test row runs it) fails on a dead link. Prove a page with the build, not the dev server: that answers every path, a deleted page too, with the same 549-byte shell (HTTP 200). Pages are served under /docs/<page> (/<page> renders the 404 page). `grep -c -F '<a heading>' apps/docs-site/dist/docs/<page>.html` is 1 for an existing page and the file is absent for a deleted one; `grep -o 'href=\"/docs/<page>\"' apps/docs-site/dist/docs/<other page>.html` shows its sidebar entry. In a browser, open http://localhost:<port>/docs/<page>."
    internal_port: 5173
    port_offset: 6
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/docs-site && exec pnpm exec vitepress dev . --host 0.0.0.0 --port 5173"
    # 2G, above the others' 1G: the gate can run cli's cold typecheck + test here
    # (~900M) beside the dev server (~220M); 512M and 1G OOM-killed it (SW-128).
    memory_limit: 2G
    memory_reservation: 768M
    node_modules_volume: node-modules
    extra_volumes:
      - tools:/opt/werkmeister-tools
      - "{{repos_root}}:{{repos_root}}"
    environment:
      PATH: /opt/werkmeister-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      COREPACK_HOME: /opt/werkmeister-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Vite refuses unknown Host headers; this lets Caddy's hostname through.
      # Registry sync fills in this machine's local_domain from config.yaml.
      DOCS_ALLOWED_HOSTS: ".{{local_domain}}"
    # docs-site.<local_domain>/
    feature_router: {}

setup_services:
  # The werkmeister repo's install + build + tools download, all in startup.sh
  # (infra/compose/scripts/werkmeister-install-startup.sh). The build runs so
  # werkmeister-core/dist exists before the app services start; the `tools` volume
  # gets docker/compose/kubectl and the pnpm shim for the host-access services.
  # SW-31: `pnpm install --frozen-lockfile` (`npm ci` for a branch still on
  # package-lock.json) never rewrites the lockfile, so an up can't dirty the
  # worktree (#148).
  # SW-33: the install is skipped while the lockfile and Node major are unchanged.
  # ~/repos and safe.directory give git the same access as the app containers,
  # so turbo hashes inputs the same way they do. ~/.werkmeister/locks queues
  # installs host-wide, WERKMEISTER_INSTALL_SLOTS (default 2) at a time, and builds
  # one at a time.
  # SW-69: the turbo cache and pnpm store are the built-in `turbo` and
  # `pnpm-store` caches, attached here and to the app services by turbo.json and
  # pnpm-lock.yaml. See them with `werkmeister feature status`; clear them with
  # `werkmeister cache prune`.
  werkmeister-install:
    image: node:22
    command: "sh /usr/local/bin/startup.sh install"
    node_modules_volume: node-modules
    startup_script: true
    extra_volumes:
      - tools:/opt/werkmeister-tools
      - "{{repos_root}}:{{repos_root}}"
      - "{{werkmeister_home}}/locks:/locks"
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      COREPACK_HOME: /opt/werkmeister-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
