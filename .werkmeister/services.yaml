# Sandbox service-registry fragment for this repo.
#
# `sandbox registry sync` (run by `sandbox setup`) merges every
# <repo>/.werkmeister/services.yaml under paths.repos_root into
# ~/.werkmeister/services.yaml. Only `services:`, `setup_services:`,
# `infrastructure:` and `repo:` (this repo's own settings, merged into
# `repos.<dir>`) may appear here; the repo key is the checkout's directory name
# and the rest of `repos:` is derived. {{home}}, {{repos_root}}, {{workspaces_root}},
# {{werkmeister_home}} (the tool's home folder) and {{local_domain}} expand at merge time. `x-` keys hold YAML
# anchors and are dropped from the output.

# Ship detection for `sandbox pr status` and the pre-PR gate's release check
# (docs/workspace-lifecycle.md): changesets publishes and tags each release, so
# a merge has shipped once a sandbox-cli release tag contains it.
repo:
  ship: tag
  release_tag: "werkmeister@*"
  release_check: pnpm changeset status --since=origin/main
  # Changes here touch no service, so the gate runs no service tests for them.
  # Anything else outside a service's `path` still touches every service.
  no_service_paths: [docs, .changeset, .gitignore, README.md]

services:
  # --- The sandbox repo's own workspaces (self-hosting) -----------------------
  # All five share one repo bind mount at /app and one per-feature node_modules
  # volume; werkmeister-install populates it and builds werkmeister-core/dist first.
  # 1G each: the pre-PR gate can run the dashboard's build in any of them, and
  # it runs out of heap at 512M.
  # cli, werkmeister-core and werkmeister-vscode (types cli/library/extension) idle under
  # `sleep infinity` with no healthcheck; their `command:` watchers run only under
  # `sandbox up --dev`. The port is still published, so they keep their slot.
  # See docs/users-guide.md "Self-hosting the sandbox repo" in the sandbox repo.
  # Fully functional CLI: the host's docker socket plus ~/.werkmeister, ~/repos,
  # ~/features and ~/.kube mounted at their host paths, because the compose
  # files it generates carry host bind-mount paths and the daemon is the
  # host's. HOME matches so `~` expands the same way; PATH puts the worktree's
  # own `sandbox` wrapper first (the dogfood point) and the tools volume next.
  # GIT_CONFIG_* marks every directory safe: the worktrees belong to the host
  # uid, and git refuses "dubious ownership" otherwise. The anchors below are
  # reused by every other service here, so this entry must stay above them.
  cli:
    path: apps/cli
    type: cli
    archetype: node-tool
    # apps/werkmeister-mcp ships inside the CLI (dist/mcp.js), so its tests run here.
    test: "pnpm turbo run test --filter=werkmeister --filter=werkmeister-mcp"
    validate: "Build, then run the built sandbox binary against a temp fixture workspace. Assert on exit code, stdout/stderr, and the files it writes."
    internal_port: 3998
    port_offset: 3
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/cli && exec pnpm run watch"
    memory_limit: 1G
    memory_reservation: 128M
    node_modules_volume: node-modules
    extra_volumes: &host_mounts
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{werkmeister_home}}:{{werkmeister_home}}"
      - "{{repos_root}}:{{repos_root}}"
      - "{{workspaces_root}}:{{workspaces_root}}"
      - "{{home}}/.kube:{{home}}/.kube:ro"
      - tools:/opt/sandbox-tools
    environment: &host_env
      HOME: "{{home}}"
      PATH: /app/apps/cli:/opt/sandbox-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DOCKER_CONFIG: /opt/sandbox-tools/docker
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # SW-31: pnpm is corepack's shim in the tools volume (werkmeister-install puts
      # it there); the pnpm version it fetches lives there too, so it downloads
      # once per feature, without the prompt that would hang a container.
      COREPACK_HOME: /opt/sandbox-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Read by werkmeister-dashboard; harmless for the others.
      HOST: 0.0.0.0

  werkmeister-core:
    path: packages/werkmeister-core
    type: library
    archetype: node-tool
    test: "pnpm turbo run test --filter=werkmeister-core"
    internal_port: 3999
    port_offset: 2
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd packages/werkmeister-core && exec pnpm exec tsc --watch --preserveWatchOutput"
    memory_limit: 1G
    memory_reservation: 128M
    node_modules_volume: node-modules
    # Same host access as cli: the repos mount makes the worktree's .git
    # resolve, and the socket + tools let its docker tests run (#134).
    extra_volumes: *host_mounts
    environment: *host_env

  # Also the MCP client bed: its archetype wires the sandbox server, and
  # SANDBOX_MCP_TOKEN arrives via the feature .env (a missing one makes
  # `sandbox up` refuse the workspace). It has cli's host access too, so its
  # tests can use docker directly (#134).
  werkmeister-vscode:
    path: packages/werkmeister-vscode
    type: extension
    archetype: mcp-client
    test: "pnpm turbo run test --filter=werkmeister-vscode"
    internal_port: 3997
    port_offset: 4
    health_endpoint: /
    setup_service: werkmeister-install
    # Dockerfile adds xvfb and Electron's libs; the stock image makes
    # test:integration exit 127 (SW-62). The tag is local, never pulled.
    image: werkmeister-vscode:local
    dockerfile: Dockerfile
    command: "cd packages/werkmeister-vscode && exec pnpm run watch"
    memory_limit: 1G
    memory_reservation: 128M
    node_modules_volume: node-modules
    extra_volumes: *host_mounts
    environment: *host_env
    secrets: [SANDBOX_MCP_TOKEN]

  # Serves the workspace dashboard + MCP endpoint; its tools shell out to the
  # CLI, docker and kubectl, so it gets the same host access as `cli`.
  werkmeister-dashboard:
    path: apps/werkmeister-dashboard
    type: web
    archetype: node-web
    test: "pnpm turbo run test --filter=werkmeister-dashboard"
    internal_port: 3001
    port_offset: 5
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/werkmeister-dashboard && exec pnpm run dev"
    memory_limit: 1G
    memory_reservation: 256M
    node_modules_volume: node-modules
    extra_volumes: *host_mounts
    environment: *host_env
    # werkmeister-dashboard.<local_domain> — local only; nothing runs in the cluster.
    feature_router: {}

  # The public docs site (SW-80): VitePress dev server over the repo's docs, in
  # place, with hot reload. It shells out to nothing, so it gets only the tools
  # volume (pnpm for the gate's test) and the repos mount (git for turbo), not
  # cli's host access.
  docs-site:
    path: apps/docs-site
    type: web
    archetype: node-web
    test: "pnpm turbo run test --filter=docs-site"
    validate: "Open the page and the sidebar entry for the doc you changed; `pnpm --filter docs-site build` fails on a dead link."
    internal_port: 5173
    port_offset: 6
    health_endpoint: /
    setup_service: werkmeister-install
    image: node:22
    command: "cd apps/docs-site && exec pnpm exec vitepress dev . --host 0.0.0.0 --port 5173"
    memory_limit: 512M
    memory_reservation: 128M
    node_modules_volume: node-modules
    extra_volumes:
      - tools:/opt/sandbox-tools
      - "{{repos_root}}:{{repos_root}}"
    environment:
      PATH: /opt/sandbox-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      COREPACK_HOME: /opt/sandbox-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Vite refuses unknown Host headers; this lets Caddy's hostname through.
      # Registry sync fills in this machine's local_domain from config.yaml.
      DOCS_ALLOWED_HOSTS: ".{{local_domain}}"
    # docs-site.<local_domain>/
    feature_router: {}

setup_services:
  # The sandbox repo's install + build + tools download, all in startup.sh
  # (infra/compose/scripts/werkmeister-install-startup.sh). The build runs so
  # werkmeister-core/dist exists before the app services start; the `tools` volume
  # gets docker/compose/kubectl and the pnpm shim for the host-access services.
  # SW-31: `pnpm install --frozen-lockfile` (`npm ci` for a branch still on
  # package-lock.json) never rewrites the lockfile, so an up can't dirty the
  # worktree (#148).
  # SW-33: the install is skipped while the lockfile and Node major are unchanged.
  # ~/repos and safe.directory give git the same access as the app containers,
  # so turbo hashes inputs the same way they do. ~/.werkmeister/locks queues
  # installs host-wide, SANDBOX_INSTALL_SLOTS (default 2) at a time, and builds
  # one at a time.
  # SW-69: the turbo cache and pnpm store are the built-in `turbo` and
  # `pnpm-store` caches, attached here and to the app services by turbo.json and
  # pnpm-lock.yaml. See them with `werkmeister status`; clear them with
  # `werkmeister cache prune`.
  werkmeister-install:
    image: node:22
    command: "sh /usr/local/bin/startup.sh install"
    node_modules_volume: node-modules
    startup_script: true
    extra_volumes:
      - tools:/opt/sandbox-tools
      - "{{repos_root}}:{{repos_root}}"
      - "{{werkmeister_home}}/locks:/locks"
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      COREPACK_HOME: /opt/sandbox-tools/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
